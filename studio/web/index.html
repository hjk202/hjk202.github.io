<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Space Studio</title>
</head>
<body>
  <template id="maintenance-view">
  <header class="app-header">
    <h1>Studio</h1>
    <nav aria-label="工作区">
      <details id="workspace-switcher" class="control-menu">
        <summary aria-label="切换工作区，当前 Think"><span id="current-workspace">Think</span></summary>
        <div class="control-menu-content">
          <div id="workspace-content"></div>
          <div id="workspace-tasks"><button id="space-public" type="button" hidden>返回公开工作区</button></div>
        </div>
      </details>
    </nav>
  </header>
  <div id="studio-content">
  <div class="workspace">
    <aside aria-label="Think 文章">
      <div class="toolbar"><h2>文章</h2><button id="new" type="button">新建文章</button></div>
      <details id="think-list-options" class="control-menu">
        <summary>筛选与刷新</summary>
        <div class="control-menu-content">
          <label for="filter">文章状态</label>
          <select id="filter"><option value="all">全部</option><option value="draft">草稿</option><option value="published">构建纳入</option></select>
          <button id="refresh" type="button">刷新列表</button>
        </div>
      </details>
      <p id="list-message" role="status"></p>
      <ul id="documents"></ul>
    </aside>
    <main>
      <p id="empty">选择一篇文章开始写作。</p>
      <form id="editor" hidden>
        <div class="toolbar editor-actions">
          <button id="save" type="button">保存</button>
          <button id="preview" type="button">网站预览</button>
          <button id="cancel-preview" type="button" hidden>取消预览</button>
          <details id="think-actions" class="control-menu">
            <summary>更多</summary>
            <div class="control-menu-content">
              <button id="validate" type="button">校验</button>
              <button id="reload" type="button">重新读取源文件</button>
              <button id="delete" type="button" class="danger-action">删除文章</button>
            </div>
          </details>
          <strong id="save-state" role="status"></strong>
        </div>
        <p id="editor-heading" hidden>源文件只读 · 需要修复</p>
        <p id="message" role="status" aria-live="polite"></p>
        <section aria-label="校验结果"><p id="validation-state"></p><ul id="issues"></ul></section>
        <fieldset id="fields" class="think-fields">
          <label class="title-label"><span class="visually-hidden">标题</span><input id="title" name="title" placeholder="文章标题" autocomplete="off" aria-describedby="issues"></label>
          <details id="think-properties">
          <summary>文章属性</summary>
          <div class="metadata">
            <label>Slug<input id="slug" name="slug" autocomplete="off" spellcheck="false" aria-describedby="slug-help issues"></label>
            <p id="slug-help" class="hint">已有文章的 slug 只读；新建使用小写英文、数字和连字符。</p>
            <label>摘要<textarea id="summary" name="summary" rows="2" aria-describedby="issues"></textarea></label>
            <label>日期<input id="date" name="date" placeholder="YYYY-MM-DD" autocomplete="off" aria-describedby="issues"></label>
            <label>内容类型<select id="kind" name="kind" aria-label="内容类型" aria-describedby="issues"><option value="">源中省略（按 article 展示）</option><option value="article">article · 文章</option><option value="note">note · 随记</option></select></label>
            <label>候选公开状态<select id="published" name="published" aria-label="候选公开状态" aria-describedby="issues"><option value="">源中省略（draft）</option><option value="false">draft · 草稿</option><option value="true">published · 构建纳入</option></select></label>
          </div>
          </details>
          <label class="body-label">Markdown 正文<textarea id="body" name="body" rows="20" spellcheck="false" aria-describedby="issues"></textarea></label>
        </fieldset>
        <details id="think-ai"><summary>AI 建议</summary>
        <section id="ai-panel" aria-label="AI 文本建议">
          <p id="ai-service" class="hint" role="status">正在读取 AI 配置…</p>
          <p class="hint">请求建议会将下方正文发送至阿里云百炼，单次最多 32 KiB，可能计费。采纳后仍需保存。</p>
          <label>将发送的正文（只读快照）<textarea id="ai-input" readonly rows="4" spellcheck="false"></textarea></label>
          <label>建议操作<select id="ai-operation" aria-label="建议操作"><option value="polish">润色正文</option><option value="rewrite">改写正文</option><option value="summarize">概括正文（采纳将替换正文）</option><option value="generateTitle">生成标题</option><option value="generateSummary">生成 metadata 摘要</option></select></label>
          <div class="toolbar"><button id="ai-request" type="button" disabled>请求建议</button><button id="ai-cancel" type="button" hidden>取消建议</button><button id="ai-apply" type="button" disabled>采纳到正文（替换）</button><button id="ai-discard" type="button" disabled>丢弃建议</button></div>
          <p id="ai-state" role="status"></p>
          <label>AI 建议（未采纳）<textarea id="ai-output" readonly rows="7" spellcheck="false"></textarea></label>
        </section>
        </details>
        <section id="preview-panel" aria-label="隔离预览" hidden><h2>隔离预览</h2><p id="preview-state" role="status"></p><div id="preview-frame"></div></section>
        <details class="source-details"><summary>源文件与版本信息</summary>
          <p id="source-state"></p>
          <p class="hint">公开状态表示下次构建是否纳入。</p>
          <p>文件 <output id="filename"></output></p>
          <p>版本 <code id="revision"></code></p>
        </details>
      </form>
    </main>
  </div>
  </div>
  </template>
  <noscript>请启用 JavaScript 以使用本地编辑器。</noscript>
  <!--studio-session-->
  <script type="module" src="./entry.ts"></script>
</body>
</html>
