name: Verify and publish Personal Space
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Studio {0} {1}', inputs.studio_request, inputs.expected_sha) || github.workflow }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved main commit SHA
        required: true
        type: string
      studio_request:
        description: Studio publication request UUID, or manual
        required: true
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: personal-space-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  SITE_URL: ${{ vars.SITE_URL }}
  BASE_PATH: ${{ vars.BASE_PATH || '/' }}

jobs:
  check:
    name: Verify static candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      checked_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Guard the exact approved publication SHA
        id: identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          STUDIO_REQUEST: ${{ inputs.studio_request }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
            [[ "$STUDIO_REQUEST" == "manual" || "$STUDIO_REQUEST" =~ ^[a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}$ ]]
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Classify an exact single-article Studio change
        id: think_scope
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          STUDIO_REQUEST: ${{ inputs.studio_request }}
          EVENT_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          # STUDIO_THINK_FAST_V1: both events recompute the scope from Git.
          # The push is scope-only; the approved dispatch checks content and builds once.
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]] ||
             [[ "$GITHUB_REF" != "refs/heads/main" || "${STUDIO_REQUEST:-}" == "manual" || "${EVENT_FORCED:-}" == "true" ]]; then exit 0; fi
          parent="$(git cat-file commit HEAD | sed -n '/^$/q; s/^parent //p')" || exit 0
          [[ "$parent" =~ ^[a-f0-9]{40}$ ]] || exit 0
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "${EVENT_BEFORE:-}" != "$parent" || "${EVENT_FORCED:-}" != "false" ) ]]; then exit 0; fi
          diff_file="$(mktemp)" || exit 0
          trap 'rm -f -- "$diff_file"' EXIT
          git diff-tree --no-commit-id --no-renames --name-status -r -z "$parent" HEAD > "$diff_file" || exit 0
          mapfile -d '' -t diff < "$diff_file" || exit 0
          [[ "${#diff[@]}" == 2 && "${diff[0]}" =~ ^[AM]$ ]] || exit 0
          [[ "${diff[1]}" =~ ^src/modules/think/content/([a-z0-9]+(-[a-z0-9]+)*)\.md$ ]] || exit 0
          slug="${BASH_REMATCH[1]}"
          expected="$(printf 'Publish think: %s\n\nStudio-Think-Verification: github-think-v1' "$slug")"
          [[ "$(git log -1 --format=%B)" == "$expected" ]] || exit 0
          [[ "$(git ls-tree HEAD -- "${diff[1]}" | cut -d ' ' -f 1)" == "100644" ]] || exit 0
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo 'push_only=true' >> "$GITHUB_OUTPUT"
          else
            echo "article=${diff[1]}" >> "$GITHUB_OUTPUT"
            echo "parent=$parent" >> "$GITHUB_OUTPUT"
          fi
      - name: Require a verified parent for the content-only gate
        id: content_gate
        if: steps.think_scope.outputs.article != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ steps.think_scope.outputs.parent }}
        run: |
          set -euo pipefail
          [[ "$PARENT_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 0
          repo="repos/$GITHUB_REPOSITORY/actions"
          run="$(gh api "$repo/workflows/deploy.yml/runs?branch=main&head_sha=$PARENT_SHA&status=success&per_page=10" --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0] | [.id, .run_attempt] | @tsv')" || exit 0
          IFS=$'\t' read -r id attempt <<< "$run"
          [[ "$id" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]] || exit 0
          verified="$(gh api "$repo/runs/$id/attempts/$attempt/jobs" --jq '[.jobs[] | select(.name == "Verify static candidate" and .conclusion == "success") | .steps[] | select(.name == "Record the checked root artifact" and .conclusion == "success")] | length')" || exit 0
          if [[ "$verified" == '1' ]]; then echo 'fast=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.think_scope.outputs.push_only != 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the project npm version
        if: steps.think_scope.outputs.push_only != 'true'
        run: if [[ "$(npm --version)" != '10.9.8' ]]; then npm install --global npm@10.9.8; fi
      - name: Install locked dependencies
        if: steps.think_scope.outputs.push_only != 'true'
        run: npm ci
      - name: Verify approved Think contents and resources
        if: steps.think_scope.outputs.article != ''
        env:
          APPROVED_ARTICLE: ${{ steps.think_scope.outputs.article }}
        run: node --experimental-strip-types scripts/release/check-think.mjs "$APPROVED_ARTICLE"
      - name: Lint
        if: steps.think_scope.outputs.push_only != 'true' && steps.content_gate.outputs.fast != 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.think_scope.outputs.push_only != 'true' && steps.content_gate.outputs.fast != 'true'
        run: npm run typecheck
      - name: Unit tests
        if: steps.think_scope.outputs.push_only != 'true' && steps.content_gate.outputs.fast != 'true'
        run: npm run test
      - name: Build the publishable artifact
        if: steps.think_scope.outputs.push_only != 'true'
        run: npm run build
      - name: Install test browsers
        if: steps.think_scope.outputs.push_only != 'true' && steps.content_gate.outputs.fast != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Verify the actual root artifact
        if: steps.think_scope.outputs.push_only != 'true' && steps.content_gate.outputs.fast != 'true'
        run: npm run test:e2e
      - name: Verify WebKit mobile interactions
        if: steps.think_scope.outputs.push_only != 'true' && steps.content_gate.outputs.fast != 'true'
        run: npm run test:e2e
        env:
          E2E_BROWSER: webkit
          E2E_MOBILE: '1'
      - name: Verify WebKit private interactions
        if: steps.think_scope.outputs.push_only != 'true' && steps.content_gate.outputs.fast != 'true'
        run: npm run test:e2e -- --grep "Vault|private|Unlock|opening and reopening"
        env:
          E2E_BROWSER: webkit
      - name: Verify isolated real private adapter and session
        if: steps.think_scope.outputs.push_only != 'true' && steps.content_gate.outputs.fast != 'true'
        run: |
          node tests/verify-vault-session.mjs
          E2E_DIST="$(cat .cache/vault-session-output.txt)" E2E_SESSION_PROBE=1 npm run test:e2e
      - name: Verify isolated extension and content contracts
        if: steps.think_scope.outputs.push_only != 'true' && steps.content_gate.outputs.fast != 'true'
        run: |
          npm run test:extension
          node tests/verify-content.mjs
          node tests/verify-design.mjs
          node tests/verify-mobile.mjs
      - name: Verify a project base without rebuilding dist
        if: steps.think_scope.outputs.push_only != 'true' && steps.content_gate.outputs.fast != 'true'
        run: |
          npm run build -- --base /personal-space/ --outDir .cache/base-dist
          npm run test:e2e
        env:
          E2E_BASE_PATH: /personal-space/
          E2E_DIST: .cache/base-dist
      - name: Record the checked root artifact
        if: steps.think_scope.outputs.push_only != 'true'
        run: |
          node scripts/release/record.mjs
          node tests/verify-release.mjs
          node --experimental-strip-types tests/verify-vault-release.mjs
      - name: Upload only the checked dist for manual publication
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    name: Publish checked Pages artifact
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck approved SHA before deployment
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.expected_sha }}
          CHECKED_SHA: ${{ needs.check.outputs.checked_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_SHA" == "$GITHUB_SHA" && "$CHECKED_SHA" == "$APPROVED_SHA" ]]
          remote_sha="$(git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
          [[ "$remote_sha" == "$APPROVED_SHA" ]]
      - name: Deploy the already checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
