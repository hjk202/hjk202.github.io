name: Verify and publish Personal Space

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-space-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  SITE_URL: ${{ vars.SITE_URL }}
  BASE_PATH: ${{ vars.BASE_PATH || '/' }}

jobs:
  check:
    name: Verify static candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the project npm version
        run: npm install --global npm@10.9.8
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build the publishable artifact
        run: npm run build
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify the actual root artifact
        run: npm run test:e2e
      - name: Verify WebKit mobile interactions
        run: npm run test:e2e
        env:
          E2E_BROWSER: webkit
          E2E_MOBILE: '1'
      - name: Verify isolated extension and content contracts
        run: |
          npm run test:extension
          node tests/verify-content.mjs
          node tests/verify-design.mjs
          node tests/verify-mobile.mjs
      - name: Verify a project base without rebuilding dist
        run: |
          npm run build -- --base /personal-space/ --outDir .cache/base-dist
          npm run test:e2e
        env:
          E2E_BASE_PATH: /personal-space/
          E2E_DIST: .cache/base-dist
      - name: Record the checked root artifact
        run: node tests/verify-release.mjs
      - name: Upload only the checked dist for manual publication
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    name: Publish checked Pages artifact
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the already checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
